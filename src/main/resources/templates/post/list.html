<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/origin}">
	<section layout:fragment="contents" class="contents container">
		<div class="row justify-content-center">
	    	<div class="col-auto" >
	      		<div th:each="post : ${posts}" class="feed bg-white">
	      			<div th:text=" '@' + ${userIdToNickName[post.userId]}" class="id border border-dark"> @ jinan</div>
	      			<div class="photo border border-dark">
						<img th:each="img : ${post.images}" 
				             th:src="@{${img.imagePath}}" 
				             th:alt="'Image ' + ${img.id}" 
				             width="700" height="300"
				             class="border border-secondary" />
					</div>
	      			<div th:text="${post.title}" class="main">우하하하하</div>
	      			<div class = "option">
	      			
	      				<button class="btn">
						  <i class="bi bi-heart"></i> 좋아요
						</button>
	      				<button class="btn">
						  <i class="bi bi-chat"></i> 댓글
						</button>
			      	</div>
	      			<div class = "comment">@marondal 재밌네요 ㅎㅎ</div>
	      		</div>
	      		
	    	</div>
	  	</div>
	</section>
</html>
